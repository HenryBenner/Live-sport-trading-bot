name: Python check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  py_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Show repo files
        run: find . -maxdepth 3 -type f | sort
      - name: Compile Python files
        run: |
          python -m py_compile \
            iphone/iphone_sender.py \
            server/__init__.py \
            server/config_loader.py \
            server/open_order_manager.py \
            server/kalshi_client.py \
            server/mode_handler.py \
            server/command_router.py \
            server/server.py \
            scripts/validate_config.py
